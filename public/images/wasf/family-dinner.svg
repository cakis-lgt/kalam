<svg viewBox="0 0 1024 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A family of four sitting together at a table for dinner in the evening">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c3a6e"/>
      <stop offset="55%" stop-color="#a85b7a"/>
      <stop offset="100%" stop-color="#f0a35c"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff2c6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff2c6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- wall -->
  <rect width="1024" height="420" fill="#efe1cd"/>
  <!-- floor -->
  <rect y="420" width="1024" height="156" fill="#c99a6b"/>
  <g stroke="#b98957" stroke-width="2" opacity="0.5">
    <line x1="0" y1="450" x2="1024" y2="450"/>
    <line x1="0" y1="480" x2="1024" y2="480"/>
    <line x1="0" y1="510" x2="1024" y2="510"/>
    <line x1="0" y1="540" x2="1024" y2="540"/>
  </g>

  <!-- window with dusk sky -->
  <rect x="60" y="70" width="230" height="180" rx="6" fill="#5b4630"/>
  <rect x="72" y="82" width="206" height="156" fill="url(#dusk)"/>
  <circle cx="230" cy="120" r="18" fill="#ffe9b0" opacity="0.9"/>
  <rect x="72" y="82" width="206" height="156" fill="none" stroke="#5b4630" stroke-width="6"/>
  <line x1="175" y1="82" x2="175" y2="238" stroke="#5b4630" stroke-width="6"/>
  <line x1="72" y1="160" x2="278" y2="160" stroke="#5b4630" stroke-width="6"/>

  <!-- wall clock -->
  <circle cx="900" cy="130" r="34" fill="#fdf8ee" stroke="#6b4726" stroke-width="6"/>
  <line x1="900" y1="130" x2="900" y2="110" stroke="#3a2a1c" stroke-width="3" stroke-linecap="round"/>
  <line x1="900" y1="130" x2="915" y2="134" stroke="#3a2a1c" stroke-width="3" stroke-linecap="round"/>

  <!-- picture frame -->
  <rect x="470" y="80" width="120" height="90" rx="4" fill="#fdf8ee" stroke="#6b4726" stroke-width="6"/>
  <path d="M482 154 L512 112 L536 140 L554 118 L578 154 Z" fill="#7fb478"/>
  <circle cx="500" cy="100" r="10" fill="#f2c53d"/>

  <!-- hanging lamp -->
  <line x1="512" y1="0" x2="512" y2="150" stroke="#6b4726" stroke-width="4"/>
  <circle cx="512" cy="180" r="60" fill="url(#lampGlow)"/>
  <path d="M480 150 L544 150 L530 190 L494 190 Z" fill="#e0704f"/>

  <!-- ================= TABLE ================= -->
  <ellipse cx="512" cy="430" rx="260" ry="26" fill="#00000014"/>
  <rect x="270" y="368" width="484" height="20" rx="6" fill="#a9773f"/>
  <rect x="270" y="384" width="484" height="8" fill="#8f6233"/>
  <rect x="292" y="404" width="18" height="80" fill="#8f6233"/>
  <rect x="714" y="404" width="18" height="80" fill="#8f6233"/>
  <!-- tablecloth accent -->
  <rect x="270" y="388" width="484" height="10" fill="#f4e4c8"/>

  <!-- plates and food -->
  <g>
    <circle cx="370" cy="378" r="26" fill="#fdf8ee" stroke="#e7d8bb" stroke-width="3"/>
    <circle cx="370" cy="378" r="14" fill="#e0a94f"/>
    <circle cx="450" cy="378" r="26" fill="#fdf8ee" stroke="#e7d8bb" stroke-width="3"/>
    <circle cx="450" cy="378" r="14" fill="#7fb478"/>
    <circle cx="574" cy="378" r="26" fill="#fdf8ee" stroke="#e7d8bb" stroke-width="3"/>
    <circle cx="574" cy="378" r="14" fill="#e0704f"/>
    <circle cx="654" cy="378" r="26" fill="#fdf8ee" stroke="#e7d8bb" stroke-width="3"/>
    <circle cx="654" cy="378" r="14" fill="#e0a94f"/>
  </g>
  <!-- serving bowl center -->
  <ellipse cx="512" cy="376" rx="34" ry="16" fill="#e2705b"/>
  <ellipse cx="512" cy="370" rx="30" ry="12" fill="#f2c53d"/>

  <!-- drinking glasses -->
  <rect x="400" y="352" width="10" height="20" fill="#bcd9ea" opacity="0.85"/>
  <rect x="614" y="352" width="10" height="20" fill="#bcd9ea" opacity="0.85"/>

  <!-- ================= FAMILY MEMBERS (seated) ================= -->
  <!-- Dad (left) -->
  <g>
    <rect x="320" y="330" width="56" height="60" rx="16" fill="#3f6b8f"/>
    <circle cx="348" cy="308" r="24" fill="#c98a5b"/>
    <path d="M326 306 Q328 282 348 280 Q368 282 370 306 Q356 294 348 294 Q340 294 326 306 Z" fill="#2a2019"/>
    <path d="M330 330 Q320 350 316 372" stroke="#3f6b8f" stroke-width="14" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Mom (right) -->
  <g>
    <rect x="600" y="330" width="56" height="60" rx="16" fill="#c2607f"/>
    <circle cx="628" cy="308" r="24" fill="#e2a86f"/>
    <path d="M604 314 Q600 280 628 278 Q656 280 652 314 Q652 340 646 344 Q650 316 628 314 Q606 316 610 344 Q604 340 604 314 Z" fill="#3a2a1c"/>
    <path d="M646 330 Q658 350 662 372" stroke="#c2607f" stroke-width="14" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Boy (front left, smaller) -->
  <g>
    <rect x="430" y="352" width="44" height="46" rx="14" fill="#5aa06a"/>
    <circle cx="452" cy="336" r="19" fill="#c98a5b"/>
    <path d="M434 334 Q436 314 452 312 Q468 314 470 334 Q458 324 452 324 Q446 324 434 334 Z" fill="#2a2019"/>
  </g>

  <!-- Girl (front right, smaller) -->
  <g>
    <rect x="540" y="352" width="44" height="46" rx="14" fill="#e0a94f"/>
    <circle cx="562" cy="336" r="19" fill="#e2a86f"/>
    <path d="M542 340 Q539 314 562 312 Q585 314 582 340 Q582 356 578 358 Q580 336 562 335 Q544 336 546 358 Q542 356 542 340 Z" fill="#5c3a24"/>
    <circle cx="550" cy="330" r="4" fill="#e0704f"/>
    <circle cx="574" cy="330" r="4" fill="#e0704f"/>
  </g>

  <!-- chairs (behind figures, just visible) -->
  <g opacity="0.9" fill="#8f6233">
    <rect x="312" y="386" width="8" height="60"/>
    <rect x="376" y="386" width="8" height="60"/>
    <rect x="592" y="386" width="8" height="60"/>
    <rect x="656" y="386" width="8" height="60"/>
  </g>
</svg>
